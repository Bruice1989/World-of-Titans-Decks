name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential ccache \
            libgl1-mesa-dev libgles2-mesa-dev

      - name: Set JAVA_HOME to Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-31" 2>/dev/null || true
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager \
                 $ANDROID_HOME/tools/bin/avdmanager
          mkdir -p $ANDROID_HOME/licenses
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
            > $ANDROID_HOME/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" \
            > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Clear old Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Point Buildozer to system Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

      - name: Install Buildozer + dependencies
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.37"
          pip install "sh==1.14.3"
          pip install "setuptools==65.5.0" "wheel==0.43.0"
          pip install buildozer==1.5.0
          pip install git+https://github.com/kivy/python-for-android.git@master
          pip install appdirs colorama jinja2 meson ninja build toml packaging
          pip install --user "Cython==0.29.37"

      - name: Set Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Build APK (debug)
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          export CYTHON=$(which cython)
          mkdir -p logs
          buildozer -v android debug 2>&1 | tee logs/build.log
        continue-on-error: true

      - name: Fix pygame - copy from site-packages to python-installs
        run: |
          # Видаляємо x86_64 pygame
          find .buildozer -path "*/python-installs/worldtitans/*/pygame" -type d -exec rm -rf {} + 2>/dev/null || true

          # Знаходимо правильний arm64 pygame
          INSTALL_DIR=$(find .buildozer -path "*/python-installs/worldtitans/arm64-v8a" -type d 2>/dev/null | head -1)
          PYGAME_SRC=$(find .buildozer -path "*/_python_bundle__arm64-v8a/_python_bundle/site-packages/pygame" -type d 2>/dev/null | head -1)

          echo "Install dir: $INSTALL_DIR"
          echo "Pygame src: $PYGAME_SRC"

          if [ -n "$PYGAME_SRC" ] && [ -n "$INSTALL_DIR" ]; then
            cp -r "$PYGAME_SRC" "$INSTALL_DIR/pygame"
            echo "Скопійовано arm64 pygame до python-installs!"
          fi

          # Знаходимо gradlew
          GRADLEW=$(find .buildozer -name "gradlew" -type f 2>/dev/null | head -1)
          echo "Gradlew: $GRADLEW"
          if [ -n "$GRADLEW" ]; then
            DIST_DIR=$(dirname "$GRADLEW")
            echo "Dist dir: $DIST_DIR"
            cd "$DIST_DIR"
            ./gradlew assembleDebug 2>&1 | tee -a /home/runner/work/World-of-Titans-Decks/World-of-Titans-Decks/logs/build.log
          else
            echo "gradlew не знайдено!"
            find .buildozer -name "*.gradle" 2>/dev/null | head -10
          fi
        continue-on-error: true

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" 2>/dev/null || echo "APK не знайдено"
          mkdir -p bin
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true

      - name: Show errors
        if: always()
        run: |
          grep -i "error\|fatal\|failed\|Exception" logs/build.log | tail -20 || true
          tail -30 logs/build.log || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: logs/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfTitans-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
