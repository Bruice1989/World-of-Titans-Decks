name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev build-essential ccache \
            libgl1-mesa-dev libgles2-mesa-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set JAVA_HOME to Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Setup Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "ndk;25.2.9519653"
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager \
                 $ANDROID_HOME/tools/bin/avdmanager
          mkdir -p $ANDROID_HOME/licenses
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
            > $ANDROID_HOME/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" \
            > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Clean all caches
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf p4a-recipes

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "Cython==0.29.37"
          pip install --user "Cython==0.29.37"
          pip install "sh==1.14.3"
          pip install "buildozer==1.5.0"
          pip install appdirs colorama jinja2 packaging
          # Робимо cython доступним у всіх шляхах
          sudo ln -sf $(which cython) /usr/local/bin/cython
          sudo ln -sf $(which cython) /usr/bin/cython
          cython --version

      - name: Clone p4a and patch pygame_ce recipe
        run: |
          git clone --depth=1 -b master https://github.com/kivy/python-for-android.git /tmp/p4a
          # Перевіряємо чи є рецепт pygame_ce
          ls /tmp/p4a/pythonforandroid/recipes/ | grep pygame || echo "pygame рецептів немає"
          # Копіюємо рецепт якщо є
          if [ -d /tmp/p4a/pythonforandroid/recipes/pygame_ce ]; then
            echo "Рецепт pygame_ce знайдено в p4a"
            mkdir -p p4a-recipes/pygame_ce
            cp /tmp/p4a/pythonforandroid/recipes/pygame_ce/__init__.py p4a-recipes/pygame_ce/__init__.py
          else
            echo "Рецепт pygame_ce НЕ знайдено — створюємо вручну"
            mkdir -p p4a-recipes/pygame_ce
            cat > p4a-recipes/pygame_ce/__init__.py << 'RECIPE'
from pythonforandroid.recipe import CppCompiledComponentsPythonRecipe
from os.path import join
import sh

class PygameCERecipe(CppCompiledComponentsPythonRecipe):
    name = 'pygame_ce'
    version = '2.5.3'
    url = 'https://github.com/pygame-community/pygame-ce/archive/refs/tags/{version}.tar.gz'
    depends = ['sdl2', 'sdl2_image', 'sdl2_mixer', 'sdl2_ttf', 'python3']
    patches = []

    def prebuild_arch(self, arch):
        super().prebuild_arch(arch)
        hostpython = self.ctx.hostpython
        sh.Command(hostpython)('-m', 'pip', 'install', 'cython==0.29.37', '--user')

    def get_recipe_env(self, arch):
        env = super().get_recipe_env(arch)
        sdl2_build = join(
            self.get_recipe('sdl2', self.ctx).get_build_dir(arch.arch),
            'build'
        )
        env['SDL_CONFIG'] = join(sdl2_build, 'sdl2-config')
        return env

recipe = PygameCERecipe()
RECIPE
          fi
          cat p4a-recipes/pygame_ce/__init__.py

      - name: Set Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4g"
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "21"
          CYTHON: /opt/hostedtoolcache/Python/3.10.20/x64/bin/cython
        run: |
          export PATH="/opt/hostedtoolcache/Python/3.10.20/x64/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          mkdir -p logs
          buildozer -v android debug 2>&1 | tee logs/build.log

      - name: Find and copy APK
        if: always()
        run: |
          find . -name "*.apk" 2>/dev/null || echo "APK не знайдено"
          mkdir -p bin
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/build.log
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfTitans-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
