name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential ccache \
            libgl1-mesa-dev libgles2-mesa-dev

      - name: Set JAVA_HOME to Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-31" 2>/dev/null || true
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 $ANDROID_HOME/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager \
                 $ANDROID_HOME/tools/bin/avdmanager
          mkdir -p $ANDROID_HOME/licenses
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
            > $ANDROID_HOME/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" \
            > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Clear old Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Point Buildozer to system Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

      - name: Install Buildozer + dependencies
        run: |
          pip install --upgrade pip wheel
          pip install "Cython==0.29.37"
          pip install "sh>=1.10,<2.0"
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21

      - name: Set Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Download pygame source and patch it
        run: |
          # Завантажуємо pygame 2.1.3 і патчимо setup.py
          pip download pygame==2.1.3 --no-deps -d /tmp/pygame_src --no-binary pygame
          cd /tmp/pygame_src
          tar -xzf pygame-2.1.3.tar.gz 2>/dev/null || unzip pygame-2.1.3.zip 2>/dev/null || true
          # Патчимо spawn
          find /tmp/pygame_src -name "*.py" -exec grep -l "distutils.ccompiler.spawn" {} \; | while read f; do
            echo "Патчимо $f"
            sed -i 's/distutils.ccompiler.spawn/subprocess.run/g' "$f" || true
            sed -i 's/from distutils.ccompiler import spawn/import subprocess/g' "$f" || true
          done

      - name: Build APK (debug)
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: |
          mkdir -p logs
          buildozer -v android debug 2>&1 | tee logs/build.log
          # Патчимо pygame одразу після завантаження якщо білд впав
          PYGAME_SETUP=$(find .buildozer -name "setup.py" -path "*/pygame/*" 2>/dev/null | head -1)
          if [ -n "$PYGAME_SETUP" ]; then
            echo "Знайдено pygame setup.py: $PYGAME_SETUP"
            # Замінюємо проблемний spawn
            sed -i 's/distutils\.ccompiler\.spawn/subprocess.run/g' "$PYGAME_SETUP" || true
            python -c "
          import re
          with open('$PYGAME_SETUP', 'r') as f:
              content = f.read()
          # Додаємо патч для spawn
          content = content.replace(
              'distutils.ccompiler.spawn(cmd, dry_run=self.dry_run, **kwargs)',
              'subprocess.run(cmd, check=True)'
          )
          with open('$PYGAME_SETUP', 'w') as f:
              f.write(content)
          print('Патч застосовано')
          " || true
            echo "Запускаємо білд знову..."
            buildozer -v android debug 2>&1 | tee -a logs/build.log
          fi
        continue-on-error: true

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" 2>/dev/null || echo "APK не знайдено"
          mkdir -p bin
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true

      - name: Show errors
        if: always()
        run: |
          grep -i "error\|fatal\|failed\|Exception" logs/build.log | tail -20 || true
          tail -30 logs/build.log || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: logs/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfTitans-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
